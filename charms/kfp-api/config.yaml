options:
  k8s-service-name:
    type: string
    default: "ml-pipeline"
    description: Name of the Kubernetes service where kfp-api will expose itself
  grpc-port:
    type: string
    default: '8887'
    description: GRPC port
  http-port:
    type: string
    default: '8888'
    description: HTTP port
  log-archive-filename:
    type: string
    default: 'main.log'
    description: Name of log file in object storage
  log-archive-prefix:
    type: string
    default: '/artifacts'
    description: Prefix for log file in object storage
  auto-update-default-version:
    type: boolean
    default: true
    description: |
      If true, the default pipeline version will be updated
      when uploading a new version of a pipeline
  cache-image:
    type: string
    # Source: https://github.com/kubeflow/pipelines/blob/2.18.0/manifests/kustomize/base/installs/generic/pipeline-install-config.yaml
    default: "mirror.gcr.io/library/alpine:3.23.7@sha256:ff7f0c727dd796aa36787bfcd9a64bf35a6ce72a73451b3359fde849b6703d63"
    description: Which image to list as the backing image for a pipeline run step pulled from cache
  cache-enabled:
    type: boolean
    default: true
    description: If true, pipeline run steps can be cached instead of re-run
  runner-sa:
    type: string
    default: "default-editor"
    description: |
      Default pipeline runner service account.
      Used if service account is left unspecified when creating a run
  init-connection-timeout:
    type: string
    default: '6m'
    description: |
      Connection timeout used when initializing clients for related services.
      The format used can be anything accepted by `time.ParseDuration`.
  object-store-bucket-name:
    type: string
    default: "mlpipeline"
    description: Default name of object storage bucket.
  launcher-image:
    type: string
    # Source: https://github.com/kubeflow/pipelines/blob/2.18.0/manifests/kustomize/base/pipeline/ml-pipeline-apiserver-deployment.yaml
    default: "docker.io/misohu/kfp-launcher:2.18.0"
    description: Launcher image used during a pipeline's steps.
  driver-image:
    type: string
    # Source: https://github.com/kubeflow/pipelines/blob/2.18.0/manifests/kustomize/base/pipeline/ml-pipeline-apiserver-deployment.yaml
    default: "docker.io/misohu/kfp-driver:2.18.0"
    description: Driver image used during a pipeline's steps.
  log-level:
    type: string
    default: "info"
    description: Log level of api server
  default-pipeline-user-id:
    type: string
    default: ""
    description: UID used for pipeline workloads (maps to runAsUser in the main user container)
  default-pipeline-group-id:
    type: string
    default: ""
    description: GID used for pipeline workloads (maps to runAsGroup in the main user container)
  default-pipeline-non-root:
    type: string
    default: ""
    description: Enforce pipelines to run as non-root (maps to runAsNonRoot in the main user container)
